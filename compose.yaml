name: examen-cimat

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Aspirantes CIMAT}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: es_MX
  APP_TIMEZONE: America/Mexico_City
  APP_MAINTENANCE_DRIVER: file
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-aspirantes}
  DB_USERNAME: ${DB_USERNAME:-aspirantes}
  DB_PASSWORD: ${DB_PASSWORD:-aspirantes_secret}
  SESSION_DRIVER: database
  SESSION_LIFETIME: 120
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  SEED_DB: ${SEED_DB:-true}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
    image: examen-cimat/app:latest
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/www/html/bootstrap/cache:mode=1777
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: examen-cimat/web:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    networks:
      - internal

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-aspirantes}
      MARIADB_USER: ${DB_USERNAME:-aspirantes}
      MARIADB_PASSWORD: ${DB_PASSWORD:-aspirantes_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-aspirantes_root_secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  tests:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: testing
    image: examen-cimat/testing:latest
    profiles: ["testing"]
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      SEED_DB: "false"
    networks:
      - internal

  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8091}:8080"
    networks:
      - internal

volumes:
  dbdata:
    name: examen-cimat-dbdata
  app-storage:
    name: examen-cimat-storage

networks:
  internal:
    driver: bridge
