[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Necesario para que PHP-FPM reciba las variables de entorno del contenedor
; (conexión a la base de datos, APP_KEY, etc.).
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
